[project]
name = "blocksworld-bench"
version = "0.2.0"
description = "Blocksworld env benchmark: JAX vs NVIDIA Warp"
requires-python = ">=3.10"
dependencies = [
    "jax==0.12.1",
    "jaxlib==0.12.1",
    "warp-lang==1.19.0",
    "numpy",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.12.1"]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "bench/blocksworld"}
py-modules = ["common", "ground", "ref_numpy", "env_jax", "env_warp", "env_jax_tuned", "env_warp_tuned", "check", "bench", "bench_fair", "report"]
